# Integration-test profile (01 Part A item 6). Activated by AbstractIntegrationTest.
# The datasource URL/user/password come from the Testcontainers MySQL 8 container
# (@DynamicPropertySource), never from here. Nothing in this file is a real credential.
spring:
  jpa:
    hibernate:
      # Same as prod: Flyway owns the schema, Hibernate only validates it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      # Test-only, random-looking, >= 64 chars. Not used anywhere else.
      secret: 6b3f0c1e9a7d4f2b8c5e1a0d9f7b3c6e2a4d8f1b5c9e3a7d0f2b6c8e4a1d5f9b
    otp:
      expose-in-response: false

# Scheduled jobs would otherwise poll the test DB every 2 s and race the fixture.
ads:
  sync:
    cron: "-"
broadcast:
  scheduler:
    check-ms: 86400000
whatsapp:
  receipts:
    reconcile-ms: 86400000
    cleanup-ms: 86400000

management:
  health:
    mail:
      enabled: false

logging:
  level:
    root: WARN
    org.testcontainers: INFO
    com.leads: WARN

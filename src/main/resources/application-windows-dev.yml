# Local persistent database on the developer's Windows machine — XAMPP's
# bundled MariaDB (NOT MySQL Server; XAMPP ships MariaDB even though its
# folder/binaries are named "mysql"). Confirmed via `mysql --version` against
# this install: MariaDB 10.4.32. This matters for two settings below:
#   - Hibernate dialect is MariaDBDialect, not MySQLDialect, for correct DDL.
#   - Collation is utf8mb4_general_ci (MariaDB has no utf8mb4_0900_ai_ci —
#     that collation is MySQL-8-only). lower_case_table_names is already 1
#     on this XAMPP install by default — no my.ini change was needed.
# XAMPP's default root user has no password, hence DB_PASSWORD defaulting to
# empty below — override both if this install has since been secured.
# Schema: `wisenquire_db_new`, created with CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci.
#
# NOTE for prod parity: the Ubuntu production plan in
# docs/DATABASE_ARCHITECTURE.md assumes real MySQL 8 Community Server, not
# MariaDB — MariaDB and MySQL 8 diverge on native JSON support (MariaDB's
# `JSON` is a LONGTEXT + CHECK-constraint alias, not a true binary type) and
# available collations. Decide deliberately whether prod should also run
# MariaDB (what's already proven to work here) or real MySQL 8, rather than
# defaulting into a dev/prod engine mismatch.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:wisenquire_db_new}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: LeadsHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      # Schema is owned by Flyway migrations, not Hibernate — this only
      # verifies entities match the DB, never issues CREATE/ALTER.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    otp:
      # Dev convenience — must be false in prod (see application-prod.yml).
      expose-in-response: true

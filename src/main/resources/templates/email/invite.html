<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title th:text="${productName}">WiseNquire</title></head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1d2330">
  <div style="max-width:560px;margin:0 auto;padding:28px 16px">
    <div style="font-size:18px;font-weight:700;margin-bottom:18px" th:text="${productName}">WiseNquire</div>
    <div style="background:#ffffff;border:1px solid #e1e5ea;border-radius:8px;padding:24px">
      <h1 style="font-size:20px;margin:0 0 16px">You have been invited</h1>
      <p style="margin:0 0 14px;line-height:1.55"><span th:text="${inviterName}">Someone</span> invited you to join <b th:text="${organizationName}">the team</b>.</p>
      <p style="margin:0 0 14px;line-height:1.55">Accept the invitation to set your password and sign in.</p>
      <p style="margin:22px 0"><a th:href="${link}" href="#" style="display:inline-block;background:#1f6feb;color:#ffffff;text-decoration:none;padding:11px 20px;border-radius:6px;font-weight:600">Accept invitation</a></p>
      <p style="margin:0 0 14px;line-height:1.55;font-size:13px;color:#5b6470">If the button does not work, copy this address into your browser:<br><span th:text="${link}" style="word-break:break-all">link</span></p>
    </div>
    <p style="font-size:12px;color:#7a828d;margin:16px 4px 0;line-height:1.5">You received this email because of an action on your account.</p>
  </div>
</body>
</html>
